<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>白泽秘境 · 林间漫步</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050b12;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;inset:0;pointer-events:none;color:#fff}#title{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));font-size:16px;letter-spacing:.12em;text-shadow:0 2px 18px #000}#sub{position:absolute;left:max(18px,env(safe-area-inset-left));top:44px;font-size:11px;opacity:.7;letter-spacing:.14em}#score{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));font-size:12px;padding:8px 12px;border-radius:999px;background:#07172266;border:1px solid #ffffff22;backdrop-filter:blur(8px)}#tip{position:absolute;left:50%;top:15%;transform:translateX(-50%);padding:11px 16px;border-radius:15px;background:#06121c66;border:1px solid #ffffff20;backdrop-filter:blur(9px);font-size:14px;line-height:1.7;letter-spacing:.04em;text-align:center;opacity:0;transition:.35s;max-width:78vw}.btn{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff26;background:#ffffff10;backdrop-filter:blur(9px);box-shadow:0 0 25px #a7efff16,inset 0 0 22px #ffffff08;font-size:17px}#l{left:max(18px,env(safe-area-inset-left));font-size:28px}#r{left:max(114px,calc(env(safe-area-inset-left) + 114px));font-size:28px}#j{right:max(114px,calc(env(safe-area-inset-right) + 114px))}#m{right:max(18px,env(safe-area-inset-right))}.lab{position:absolute;bottom:-25px;font-size:12px;opacity:.8}#start,#done,#rotate{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#24385a44,#02060cec 70%);color:#fff;text-align:center}#done{display:none;z-index:6}#rotate{display:none;z-index:9;background:#02060cf4;line-height:1.8}.card{padding:28px}.logo{font-size:30px;letter-spacing:.2em;margin-right:-.2em}.small{margin-top:13px;font-size:12px;line-height:1.8;opacity:.78}.go{margin-top:23px;display:inline-block;padding:12px 23px;border-radius:999px;border:1px solid #ffffff2d;background:#ffffff12;font-size:14px;letter-spacing:.14em}</style></head><body><canvas id="g"></canvas><div id="ui"><div id="title">白泽秘境 · 林间漫步</div><div id="sub">路桥 · 跳跃 · 灵力 · 灵光</div><div id="score">灵光 <b id="n">0</b>/4</div><div id="tip"></div><div id="l" class="btn">←<span class="lab">左</span></div><div id="r" class="btn">→<span class="lab">右</span></div><div id="j" class="btn">跳跃<span class="lab">Jump</span></div><div id="m" class="btn">灵力<span class="lab">Magic</span></div></div><div id="start"><div class="card"><div class="logo">白泽秘境</div><div class="small">沿树桥向前，跳过断点，收集灵光。<br>在断桥前施放灵力，光桥会短暂显形。</div><div class="go">轻触进入</div></div></div><div id="done"><div class="card"><div class="logo">今夜的路亮了</div><div class="small">白泽已经穿过林间路桥。<br>这一版先把“走、跳、施法、收集”的核心体验跑通。</div><div class="go" id="again">再玩一次</div></div></div><div id="rotate">请横屏体验<br>这样更接近林间漫步的感觉</div><script>(async()=>{const [bt,st]=await Promise.all([fetch('bg_b64.txt').then(r=>r.text()),fetch('sprite_b64.txt').then(r=>r.text())]);const bg=new Image(),sp=new Image();bg.src='data:image/webp;base64,'+bt.trim();sp.src='data:image/webp;base64,'+st.trim();const c=document.getElementById('g'),x=c.getContext('2d'),start=document.getElementById('start'),done=document.getElementById('done'),tip=document.getElementById('tip'),num=document.getElementById('n'),rot=document.getElementById('rotate');const L=document.getElementById('l'),R=document.getElementById('r'),J=document.getElementById('j'),M=document.getElementById('m');let W,H,D=1,last=0,play=false,bridge=0,score=0,parts=[],rings=[],stars=[];const key={l:false,r:false},p={x:535,y:468,vx:0,vy:0,w:68,h:74,dir:1,ground:false,jump:true,sq:1,glow:0};const items=[{x:1005,y:455,a:0},{x:1155,y:430,a:0},{x:1320,y:407,a:0},{x:1460,y:370,a:0}];const WORLD={w:1536,h:864};function size(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);rot.style.display=W<H?'flex':'none'}addEventListener('resize',size);size();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function say(t,ms=1900){tip.textContent=t;tip.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>tip.style.opacity=0,ms)}function floor(px){const a=[[300,620,506,490],[620,930,490,514],[930,1085,514,518],[1260,1504,508,485],[1470,1536,460,432]];if(bridge>0)a.push([1085,1260,518,510]);for(const q of a){if(px>=q[0]&&px<=q[1]){const t=(px-q[0])/(q[1]-q[0]);return q[2]+(q[3]-q[2])*t}}return null}function dust(px,py,n=10,col='210,245,255'){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*90,vy:-Math.random()*70,life:.7+Math.random()*.4,r:1+Math.random()*2.4,col})}function jump(){if(p.ground&&p.jump){p.vy=-360;p.ground=false;p.jump=false;p.sq=.78;dust(p.x,p.y+30,8)}}function magic(){if(!play)return;p.glow=1;rings.push({x:p.x,y:p.y,r:10,life:1});dust(p.x,p.y-15,24,'190,245,255');if(p.x>990&&p.x<1225){bridge=5.5;say('灵力唤醒了断桥，光桥会短暂显形。',2200)}for(const it of items){if(!it.a&&Math.hypot(it.x-p.x,it.y-p.y)<120){it.a=1;score++;num.textContent=score;dust(it.x,it.y,20,'255,226,150');say(score===4?'灵光收齐了，继续向右。':'收集到一枚灵光。',1600)}}}function hold(el,k){el.onpointerdown=e=>{e.preventDefault();if(k==='j')jump();else if(k==='m')magic();else key[k]=true};for(const ev of ['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,()=>{if(k==='l'||k==='r')key[k]=false})}hold(L,'l');hold(R,'r');hold(J,'j');hold(M,'m');addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')key.l=1;if(e.key==='ArrowRight'||e.key==='d')key.r=1;if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();jump()}if(e.key==='j'||e.key==='k')magic()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')key.l=0;if(e.key==='ArrowRight'||e.key==='d')key.r=0});function reset(){score=0;num.textContent=0;bridge=0;parts=[];rings=[];stars=[];items.forEach(i=>i.a=0);Object.assign(p,{x:535,y:468,vx:0,vy:0,dir:1,ground:false,jump:true,sq:1,glow:0});done.style.display='none'}function update(dt){if(!play||W<H)return;const acc=760,max=190;if(key.l){p.vx-=acc*dt;p.dir=-1}if(key.r){p.vx+=acc*dt;p.dir=1}if(!key.l&&!key.r)p.vx*=Math.pow(.001,dt);p.vx=clamp(p.vx,-max,max);p.vy+=860*dt;let nx=clamp(p.x+p.vx*dt,310,1515),ny=p.y+p.vy*dt,fy=floor(nx);p.ground=false;if(fy!==null&&p.vy>=0&&ny+p.h/2>=fy&&ny+p.h/2<fy+30){ny=fy-p.h/2;if(Math.abs(p.vy)>130)dust(nx,ny+p.h/2);p.vy=0;p.ground=true;p.jump=true}if(ny>930){nx=535;ny=468;p.vx=p.vy=0;bridge=0;say('掉进水里了，从树桥重新出发。')}p.x=nx;p.y=ny;p.glow=Math.max(0,p.glow-dt*1.6);p.sq+=(p.ground?1:1.07-p.sq)*Math.min(1,dt*10);if(bridge>0)bridge-=dt;for(let i=parts.length-1;i>=0;i--){let q=parts[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=45*dt;if(q.life<=0)parts.splice(i,1)}for(let i=rings.length-1;i>=0;i--){rings[i].life-=dt;rings[i].r+=105*dt;if(rings[i].life<=0)rings.splice(i,1)}if(Math.random()<.07)stars.push({x:360+Math.random()*1120,y:170+Math.random()*430,l:1+Math.random()*2,a:.2+Math.random()*.55});for(let i=stars.length-1;i>=0;i--){stars[i].l-=dt;if(stars[i].l<=0)stars.splice(i,1)}if(score===4&&p.x>1490&&p.y<440){play=false;done.style.display='flex'}}function draw(){if(!bg.complete)return;const s=Math.max(W/WORLD.w,H/WORLD.h),dw=WORLD.w*s,dh=WORLD.h*s,ox=(W-dw)/2,oy=(H-dh)/2,T=(a,b)=>[ox+a*s,oy+b*s];x.clearRect(0,0,W,H);x.drawImage(bg,ox,oy,dw,dh);let g=x.createLinearGradient(0,0,0,H*.25);g.addColorStop(0,'#02060c88');g.addColorStop(1,'#02060c00');x.fillStyle=g;x.fillRect(0,0,W,H*.25);for(const it of items){if(it.a)continue;const [a,b]=T(it.x,it.y),r=18*s,rg=x.createRadialGradient(a,b,1,a,b,r);rg.addColorStop(0,'#fffde8');rg.addColorStop(.5,'#ffd970bb');rg.addColorStop(1,'#ffd97000');x.fillStyle=rg;x.beginPath();x.arc(a,b,r,0,7);x.fill();x.fillStyle='#fff';x.save();x.translate(a,b);x.rotate(performance.now()/700);x.fillRect(-2*s,-8*s,4*s,16*s);x.fillRect(-8*s,-2*s,16*s,4*s);x.restore()}if(bridge>0){x.strokeStyle='#c6f7ffdd';x.lineWidth=9*s;x.shadowColor='#bdeeff';x.shadowBlur=18*s;x.lineCap='round';x.beginPath();[[1085,518],[1150,513],[1210,511],[1260,510]].forEach((q,i)=>{const[a,b]=T(q[0],q[1]);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke();x.shadowBlur=0}for(const q of stars){const[a,b]=T(q.x,q.y);x.fillStyle=`rgba(255,255,255,${q.a*Math.min(1,q.l)})`;x.beginPath();x.arc(a,b,1.4*s,0,7);x.fill()}for(const q of rings){const[a,b]=T(q.x,q.y);x.strokeStyle=`rgba(185,245,255,${q.life*.5})`;x.lineWidth=2*s;x.beginPath();x.arc(a,b,q.r*s,0,7);x.stroke()}for(const q of parts){const[a,b]=T(q.x,q.y);x.fillStyle=`rgba(${q.col},${Math.max(0,q.life)})`;x.beginPath();x.arc(a,b,q.r*s,0,7);x.fill()}if(sp.complete){const[a,b]=T(p.x,p.y),gl=p.glow?(28+25*p.glow)*s:0;if(gl){const rg=x.createRadialGradient(a,b,2,a,b,gl);rg.addColorStop(0,`rgba(196,246,255,${.45*p.glow})`);rg.addColorStop(1,'rgba(196,246,255,0)');x.fillStyle=rg;x.beginPath();x.arc(a,b,gl,0,7);x.fill()}x.save();x.translate(a,b+Math.sin(performance.now()*.006)*1.4*s);x.scale(p.dir,1);x.scale(.36*s*p.sq,.36*s*(2-p.sq));x.drawImage(sp,-sp.width/2,-sp.height/2);x.restore()}}function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);start.onpointerdown=()=>{reset();play=true;start.style.display='none';say('沿树桥向右走，断桥前试试跳跃和灵力。',2500)};document.getElementById('again').onpointerdown=()=>{reset();play=true};})();</script></body></html>
