<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>白泽秘境 · 林间散步</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06100e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;background:#06100e}
  #ui{position:fixed;inset:0;pointer-events:none;color:white}
  #title{position:absolute;top:max(18px,env(safe-area-inset-top));left:22px;letter-spacing:.18em;font-size:13px;opacity:.78;text-shadow:0 2px 18px rgba(0,0,0,.8)}
  #hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:15px;letter-spacing:.08em;text-align:center;line-height:1.8;opacity:0;transition:opacity .6s;background:rgba(2,12,10,.26);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);padding:12px 18px;border-radius:16px;max-width:72vw}
  #caption{position:absolute;bottom:calc(118px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:.06em;text-align:center;white-space:nowrap;text-shadow:0 3px 18px rgba(0,0,0,.95);opacity:0;transition:opacity .8s}
  .pad{position:absolute;bottom:calc(25px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.045);backdrop-filter:blur(8px);box-shadow:inset 0 0 30px rgba(255,255,255,.025);pointer-events:auto}
  #leftPad{left:22px}
  #knob{position:absolute;width:38px;height:38px;border-radius:50%;left:24px;top:24px;background:rgba(255,255,255,.14);box-shadow:0 0 20px rgba(157,255,221,.12)}
  #magic{right:22px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#d8fff0;box-shadow:0 0 28px rgba(100,255,215,.08), inset 0 0 30px rgba(127,255,223,.04)}
  #magic span{filter:drop-shadow(0 0 7px rgba(181,255,233,.55))}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(circle at 50% 42%,rgba(18,72,58,.28),rgba(1,6,5,.92) 72%);transition:opacity .8s}
  .startCard{text-align:center;padding:28px 30px}
  .logo{font-size:29px;letter-spacing:.24em;margin-right:-.24em;text-shadow:0 0 30px rgba(183,255,231,.17)}
  .sub{font-size:12px;opacity:.56;margin-top:12px;letter-spacing:.16em}
  .startBtn{margin-top:32px;display:inline-block;padding:12px 24px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);font-size:14px;letter-spacing:.12em;box-shadow:0 0 30px rgba(100,255,220,.05)}
  #progress{position:absolute;right:22px;top:max(20px,env(safe-area-inset-top));width:92px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
  #bar{height:100%;width:0%;background:rgba(208,255,239,.8);box-shadow:0 0 10px rgba(171,255,226,.6)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="title">白泽秘境 · 林间散步</div>
  <div id="progress"><div id="bar"></div></div>
  <div id="hint"></div>
  <div id="caption"></div>
  <div id="leftPad" class="pad"><div id="knob"></div></div>
  <div id="magic" class="pad"><span>✦</span></div>
  <div id="start"><div class="startCard"><div class="logo">白泽秘境</div><div class="sub">BAIZE · A QUIET WALK</div><div class="startBtn">轻触进入</div></div></div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
const start=document.getElementById('start'), hint=document.getElementById('hint'), caption=document.getElementById('caption'), bar=document.getElementById('bar');
const leftPad=document.getElementById('leftPad'), knob=document.getElementById('knob'), magicBtn=document.getElementById('magic');
let W=0,H=0,DPR=1,playing=false,last=0,time=0,audioStarted=false;
let move=0, joyId=null, joyOrigin={x:0,y:0};
let cam=0, worldW=5600, groundY=0;
const player={x:360,y:0,vx:0,vy:0,dir:1,onGround:true,magic:0,walkPhase:0};
const particles=[], fireflies=[], motes=[], rings=[];
const interactions=[
 {x:980,type:'flower',done:false,text:'光落下的地方，花会记得。'},
 {x:1760,type:'stone',done:false,text:'停一停，听见水从时间里经过。'},
 {x:2740,type:'tree',done:false,text:'一束微光，也能让沉睡的枝叶醒来。'},
 {x:3840,type:'lake',done:false,text:'月色很轻，刚好够照见自己。'},
 {x:4960,type:'gate',done:false,text:'有些路没有终点，走着走着，心就安静了。'}
];
const flowers=[]; for(let i=0;i<34;i++) flowers.push({x:780+i*125+Math.random()*60,open:Math.random()*.45,phase:Math.random()*6.28});
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);groundY=H*.69;player.y=Math.min(player.y||groundY,groundY)}
window.addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function prand(n){const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
for(let i=0;i<90;i++) fireflies.push({x:rand(0,worldW),y:rand(H*.2,H*.69),p:rand(0,6.28),s:rand(.6,1.6)});
for(let i=0;i<70;i++) motes.push({x:rand(0,worldW),y:rand(H*.15,H*.72),p:rand(0,6.28),r:rand(.6,1.8)});
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function sx(wx,par=1){return wx-cam*par}
function fogGradient(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a2a24');g.addColorStop(.42,'#0f493b');g.addColorStop(.72,'#0b2a25');g.addColorStop(1,'#04100e');return g}
function drawSky(){ctx.fillStyle=fogGradient();ctx.fillRect(0,0,W,H);let rg=ctx.createRadialGradient(W*.7,H*.33,10,W*.7,H*.33,W*.6);rg.addColorStop(0,'rgba(86,255,197,.22)');rg.addColorStop(.36,'rgba(41,211,163,.08)');rg.addColorStop(1,'rgba(4,16,14,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H)}
function hillPath(offset,base,amp,scale,par,fill){ctx.beginPath();ctx.moveTo(0,H);for(let x=-100;x<W+120;x+=60){let wx=x+cam*par+offset;let y=base+Math.sin(wx*scale)*amp+Math.sin(wx*scale*.37+2)*amp*.45;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function drawFar(){hillPath(200,H*.52,H*.07,.0032,.16,'rgba(6,42,35,.66)');hillPath(700,H*.59,H*.06,.0044,.28,'rgba(5,31,27,.9)')}
function tree(x,scale=1,par=.45,alpha=1){let X=sx(x,par);let y=groundY+25; if(X<-180||X>W+180)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(X,y);ctx.scale(scale,scale);let g=ctx.createLinearGradient(-30,-280,40,0);g.addColorStop(0,'#123e31');g.addColorStop(1,'#061915');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-45,20);ctx.bezierCurveTo(-38,-80,-70,-170,-38,-300);ctx.bezierCurveTo(-20,-350,12,-350,30,-300);ctx.bezierCurveTo(55,-220,23,-155,52,-55);ctx.lineTo(82,20);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(33,99,61,.32)';for(let i=0;i<18;i++){let bx=-110+prand(x*.013+i*7.1)*220,by=-330+prand(x*.021+i*11.7)*210,r=18+prand(x*.037+i*5.3)*28;ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawTrees(){for(let x=-300;x<worldW+400;x+=520) tree(x+((x/520)%3)*90,1.25,.42,.88);for(let x=-100;x<worldW+300;x+=790) tree(x+230,1.75,.7,.96)}
function drawVines(){ctx.save();ctx.strokeStyle='rgba(18,52,34,.8)';ctx.lineWidth=3;for(let x=-50;x<W+100;x+=140){let sway=Math.sin(time*.0006+x)*10;ctx.beginPath();ctx.moveTo(x,-10);ctx.bezierCurveTo(x+20,H*.08,x-10+sway,H*.15,x+8,H*.22);ctx.stroke();for(let j=0;j<4;j++){let yy=H*.055+j*H*.038;ctx.fillStyle='rgba(56,120,71,.44)';ctx.beginPath();ctx.ellipse(x+Math.sin(j)*10,yy,9,3.8,j*.6,0,6.28);ctx.fill()}}ctx.restore()}
function drawGround(){let grd=ctx.createLinearGradient(0,groundY-25,0,H);grd.addColorStop(0,'#102b22');grd.addColorStop(.1,'#071915');grd.addColorStop(1,'#020908');ctx.fillStyle=grd;ctx.beginPath();ctx.moveTo(0,H);for(let x=-60;x<=W+60;x+=70){let wx=x+cam;let yy=groundY+Math.sin(wx*.006)*9+Math.sin(wx*.017)*3;ctx.lineTo(x,yy)}ctx.lineTo(W,H);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(93,214,129,.16)';for(let x=-40;x<W+60;x+=32){let wx=x+cam;if(Math.sin(wx*.032)>0.35){ctx.fillRect(x,groundY-2+Math.sin(wx*.006)*9,1,4+prand(wx*.19)*6)}}}
function drawLake(){let X=sx(3600);let width=880;if(X>W||X+width<0)return;let y=groundY+4;let g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,'rgba(34,185,153,.32)');g.addColorStop(1,'rgba(5,33,30,.04)');ctx.fillStyle=g;ctx.fillRect(X,y,width,H-y);ctx.strokeStyle='rgba(161,255,226,.18)';ctx.lineWidth=1;for(let i=0;i<11;i++){let yy=y+18+i*15;ctx.beginPath();for(let x=Math.max(0,X);x<Math.min(W,X+width);x+=18){ctx.lineTo(x,yy+Math.sin((x+time*.04+i*31)*.03)*1.8)}ctx.stroke()}let moonX=X+560;let moonY=H*.34;let rg=ctx.createRadialGradient(moonX,moonY,5,moonX,moonY,110);rg.addColorStop(0,'rgba(224,255,244,.9)');rg.addColorStop(.2,'rgba(189,255,230,.35)');rg.addColorStop(1,'rgba(189,255,230,0)');ctx.fillStyle=rg;ctx.fillRect(moonX-120,moonY-120,240,240);ctx.fillStyle='rgba(234,255,248,.7)';ctx.beginPath();ctx.arc(moonX,moonY,28,0,6.28);ctx.fill()}
function drawFlowers(){for(const f of flowers){let X=sx(f.x);if(X<-20||X>W+20)continue;f.phase+=.004;let openness=clamp(f.open,0,1);let y=groundY-2+Math.sin(f.x*.006)*9;ctx.strokeStyle='rgba(102,180,107,.55)';ctx.beginPath();ctx.moveTo(X,y);ctx.lineTo(X,y-12-10*openness);ctx.stroke();ctx.fillStyle=`rgba(218,255,236,${.15+.65*openness})`;for(let k=0;k<4;k++){let a=k*Math.PI/2+f.phase*.15;ctx.beginPath();ctx.ellipse(X+Math.cos(a)*3.5*openness,y-16-Math.sin(a)*2,2.7,1.4,a,0,6.28);ctx.fill()}if(openness>.6){ctx.fillStyle='rgba(202,255,225,.45)';ctx.beginPath();ctx.arc(X,y-16,7,0,6.28);ctx.fill()}}}
function drawMotes(){for(const m of motes){let X=sx(m.x,.88);if(X<0||X>W)continue;let y=m.y+Math.sin(time*.0007+m.p)*10;ctx.fillStyle='rgba(203,255,232,.13)';ctx.beginPath();ctx.arc(X,y,m.r,0,6.28);ctx.fill()}}
function drawFireflies(){for(const f of fireflies){let X=sx(f.x,.92);if(X<-20||X>W+20)continue;let y=f.y+Math.sin(time*.001*f.s+f.p)*14;let a=.25+.65*(.5+.5*Math.sin(time*.003*f.s+f.p));let rg=ctx.createRadialGradient(X,y,0,X,y,8);rg.addColorStop(0,`rgba(224,255,205,${a})`);rg.addColorStop(1,'rgba(164,255,194,0)');ctx.fillStyle=rg;ctx.fillRect(X-8,y-8,16,16)}}
function drawLandmarks(){const stone=sx(1760); if(stone>-100&&stone<W+100){ctx.fillStyle='#0a1d18';ctx.beginPath();ctx.ellipse(stone,groundY-3,62,25,-.1,0,6.28);ctx.fill();ctx.fillStyle='rgba(146,231,192,.06)';ctx.beginPath();ctx.ellipse(stone-15,groundY-14,26,7,-.2,0,6.28);ctx.fill()}const tx=sx(2740);if(tx>-180&&tx<W+180){ctx.strokeStyle='rgba(35,83,57,.8)';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(tx,groundY);ctx.bezierCurveTo(tx-30,groundY-100,tx+20,groundY-160,tx-40,groundY-225);ctx.stroke();ctx.lineWidth=5;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(tx-15,groundY-90-i*23);ctx.lineTo(tx+(i%2===0?55:-55),groundY-130-i*20);ctx.stroke()}}const gx=sx(4960);if(gx>-250&&gx<W+250){ctx.strokeStyle='rgba(114,213,167,.28)';ctx.lineWidth=7;ctx.beginPath();ctx.arc(gx,groundY-82,90,Math.PI,0);ctx.stroke();ctx.strokeStyle='rgba(222,255,242,.11)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(gx,groundY-82,102,Math.PI,0);ctx.stroke();}}
function drawPlayer(){let X=player.x-cam, Y=player.y;player.walkPhase+=Math.abs(player.vx)*.004;let bob=Math.sin(player.walkPhase)*2.2*(Math.min(1,Math.abs(player.vx)/120));ctx.save();ctx.translate(X,Y+bob);ctx.scale(player.dir,1);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,10,25,7,0,0,6.28);ctx.fill();ctx.strokeStyle='rgba(229,244,237,.98)';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-19,-8);ctx.bezierCurveTo(-38,-15,-41,-33,-28,-38);ctx.stroke();ctx.strokeStyle='rgba(157,221,199,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-30,-37);ctx.lineTo(-39,-44);ctx.lineTo(-31,-46);ctx.stroke();let g=ctx.createRadialGradient(-8,-23,2,0,-18,38);g.addColorStop(0,'#ffffff');g.addColorStop(.63,'#e8f6ef');g.addColorStop(1,'#bcd8cb');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-18,30,24,0,0,6.28);ctx.fill();ctx.fillStyle='#dfeee7';for(const lx of [-17,-5,8,19]){ctx.beginPath();ctx.roundRect(lx-5,-7+Math.sin(player.walkPhase+(lx*0.18))*2,10,18,5);ctx.fill()}ctx.fillStyle='#f5fbf7';ctx.beginPath();ctx.arc(18,-34,20,0,6.28);ctx.fill();ctx.fillStyle='#e7f2ec';ctx.beginPath();ctx.moveTo(8,-48);ctx.lineTo(12,-62);ctx.lineTo(19,-48);ctx.fill();ctx.beginPath();ctx.moveTo(24,-50);ctx.lineTo(31,-61);ctx.lineTo(34,-45);ctx.fill();ctx.strokeStyle='rgba(176,230,212,.95)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(12,-52);ctx.quadraticCurveTo(8,-65,2,-67);ctx.stroke();ctx.beginPath();ctx.moveTo(24,-54);ctx.quadraticCurveTo(29,-67,35,-69);ctx.stroke();ctx.fillStyle='#263b34';ctx.beginPath();ctx.arc(24,-35,1.8,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(10,-35,1.8,0,6.28);ctx.fill();ctx.strokeStyle='#60766d';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(17,-30,3,.1,Math.PI-.1);ctx.stroke();if(player.magic>0){let a=player.magic;let rg=ctx.createRadialGradient(17,-46,2,17,-46,55);rg.addColorStop(0,`rgba(184,255,226,${.35*a})`);rg.addColorStop(1,'rgba(184,255,226,0)');ctx.fillStyle=rg;ctx.fillRect(-45,-110,125,125);ctx.fillStyle=`rgba(217,255,240,${.9*a})`;ctx.beginPath();ctx.arc(17,-53,3+2*a,0,6.28);ctx.fill()}ctx.restore();}
function emitMagic(){if(!playing)return;player.magic=1;for(let i=0;i<28;i++){let a=Math.random()*6.28,sp=rand(20,100);particles.push({x:player.x+Math.cos(a)*5,y:player.y-38+Math.sin(a)*4,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-25,life:rand(.6,1.2),max:1.2,r:rand(1,3)})}rings.push({x:player.x,y:player.y-30,r:8,life:1});let nearest=null,dist=999;for(const it of interactions){let d=Math.abs(it.x-player.x);if(!it.done&&d<dist){dist=d;nearest=it}}if(nearest&&dist<150){nearest.done=true;showCaption(nearest.text);if(nearest.type==='flower'){for(const f of flowers)if(Math.abs(f.x-nearest.x)<320)f.open=1}if(nearest.type==='tree'){for(const f of fireflies)if(Math.abs(f.x-nearest.x)<430)f.p=0}if(nearest.type==='gate'){showHint('你走到了森林的尽头。\n再走一遍，也会遇见不同的光。',3200)}}playChime();}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=10*dt;if(p.life<=0)particles.splice(i,1)}for(let i=rings.length-1;i>=0;i--){rings[i].life-=dt;rings[i].r+=70*dt;if(rings[i].life<=0)rings.splice(i,1)}}
function drawParticles(){for(const p of particles){let X=p.x-cam;let a=clamp(p.life/p.max,0,1);ctx.fillStyle=`rgba(220,255,239,${a})`;ctx.beginPath();ctx.arc(X,p.y,p.r,0,6.28);ctx.fill()}for(const r of rings){let X=r.x-cam;ctx.strokeStyle=`rgba(181,255,224,${r.life*.35})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(X,r.y,r.r,0,6.28);ctx.stroke()}}
function showCaption(t){caption.textContent=t;caption.style.opacity=1;clearTimeout(showCaption.t);showCaption.t=setTimeout(()=>caption.style.opacity=0,3200)}
function showHint(t,ms=2000){hint.innerHTML=t.replace(/\n/g,'<br>');hint.style.opacity=1;clearTimeout(showHint.t);showHint.t=setTimeout(()=>hint.style.opacity=0,ms)}
function update(dt){if(!playing)return;const speed=175;player.vx+=(move*speed-player.vx)*Math.min(1,dt*8);if(Math.abs(move)<.05)player.vx*=Math.pow(.02,dt);player.x=clamp(player.x+player.vx*dt,180,worldW-220);player.dir=player.vx<-4?-1:player.vx>4?1:player.dir;player.y=groundY+Math.sin(player.x*.006)*9-5;player.magic=Math.max(0,player.magic-dt*1.5);cam+=(clamp(player.x-W*.35,0,worldW-W)-cam)*Math.min(1,dt*4);bar.style.width=(player.x/worldW*100).toFixed(1)+'%';for(const it of interactions){if(!it.done&&Math.abs(it.x-player.x)<115&&!it.prompted){it.prompted=true;showHint('靠近这里，点一下右侧的 ✦',1800)} if(Math.abs(it.x-player.x)>180)it.prompted=false}updateParticles(dt)}
function render(){drawSky();drawFar();drawTrees();drawVines();drawLake();drawMotes();drawLandmarks();drawGround();drawFlowers();drawFireflies();drawParticles();drawPlayer();let v=ctx.createRadialGradient(W/2,H*.48,Math.min(W,H)*.25,W/2,H*.48,Math.max(W,H)*.72);v.addColorStop(.5,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.36)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
function loop(ts){let dt=Math.min(.033,(ts-last)/1000||0);last=ts;time=ts;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function pointerPos(e){const r=leftPad.getBoundingClientRect();return{x:e.clientX-(r.left+r.width/2),y:e.clientY-(r.top+r.height/2)}}
leftPad.addEventListener('pointerdown',e=>{joyId=e.pointerId;leftPad.setPointerCapture(e.pointerId);const p=pointerPos(e);joyOrigin=p;updateJoy(p)});
leftPad.addEventListener('pointermove',e=>{if(e.pointerId!==joyId)return;updateJoy(pointerPos(e))});
leftPad.addEventListener('pointerup',e=>{if(e.pointerId!==joyId)return;joyId=null;move=0;knob.style.transform='translate(0,0)'});
leftPad.addEventListener('pointercancel',()=>{joyId=null;move=0;knob.style.transform='translate(0,0)'});
function updateJoy(p){let dx=p.x,dy=p.y;let len=Math.hypot(dx,dy)||1,max=24;if(len>max){dx=dx/len*max;dy=dy/len*max}knob.style.transform=`translate(${dx}px,${dy}px)`;move=clamp(dx/max,-1,1)}
magicBtn.addEventListener('pointerdown',e=>{e.preventDefault();emitMagic()});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move=-1;if(e.key==='ArrowRight'||e.key==='d')move=1;if(e.key===' '){e.preventDefault();emitMagic()}});window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))move=0});
function begin(){if(playing)return;playing=true;start.style.opacity=0;setTimeout(()=>start.style.display='none',800);startAudio();showHint('左侧移动 · 右侧施放一点小魔法',2600);setTimeout(()=>showCaption('身后总有一只胖胖的小白泽跟着你。'),1200)}start.addEventListener('pointerdown',begin);
let actx,master;
function startAudio(){if(audioStarted)return;audioStarted=true;try{actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.075;master.connect(actx.destination);const freqs=[110,164.81,220,329.63];freqs.forEach((f,i)=>{let o=actx.createOscillator(),g=actx.createGain();o.type=i%2?'sine':'triangle';o.frequency.value=f;g.gain.value=.02/(i+1);o.connect(g);g.connect(master);o.start();});let lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=.08;lg.gain.value=.012;lfo.connect(lg);lg.connect(master.gain);lfo.start();}catch(e){}}
function playChime(){if(!actx)return;let o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(660,actx.currentTime);o.frequency.exponentialRampToValueAtTime(990,actx.currentTime+.35);g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.13,actx.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.8);o.connect(g);g.connect(master);o.start();o.stop(actx.currentTime+.85)}
})();
