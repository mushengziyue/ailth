<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>白泽秘境 · 林间漫步</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081321;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;width:100vw;height:100vh;background:#10233d}#ui{position:fixed;inset:0;color:#fff;pointer-events:none}#title{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));font-size:13px;letter-spacing:.12em;text-shadow:0 2px 12px #000}#count{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));font-size:12px;padding:7px 10px;border-radius:999px;background:#07132288;border:1px solid #ffffff33;backdrop-filter:blur(8px)}#tip{position:absolute;left:50%;top:13%;transform:translateX(-50%);font-size:13px;line-height:1.6;white-space:nowrap;padding:8px 13px;border-radius:999px;background:#071322a8;border:1px solid #ffffff22;opacity:0;transition:opacity .3s;text-shadow:0 1px 8px #0008}.ctrl{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#07172570;border:1px solid #d9f8ff55;box-shadow:0 0 18px #9fe9ff20,inset 0 0 20px #ffffff0a;backdrop-filter:blur(8px);pointer-events:auto;color:white;font-size:17px;text-shadow:0 2px 10px #0008}#l{left:max(16px,env(safe-area-inset-left));font-size:27px}#r{left:max(98px,calc(env(safe-area-inset-left) + 98px));font-size:27px}#j{right:max(98px,calc(env(safe-area-inset-right) + 98px))}#m{right:max(16px,env(safe-area-inset-right))}#start,#done{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#284d7348,#040912f0 72%);color:#fff;text-align:center;padding:24px}#done{display:none}.card{max-width:420px}.logo{font-size:28px;letter-spacing:.18em;margin-right:-.18em}.desc{font-size:13px;line-height:1.8;opacity:.86;margin-top:12px}.go{margin-top:22px;display:inline-block;padding:11px 22px;border-radius:999px;background:#ffffff10;border:1px solid #ffffff32;font-size:14px;letter-spacing:.12em}.portrait{position:absolute;left:50%;bottom:102px;transform:translateX(-50%);font-size:11px;opacity:.7;white-space:nowrap}@media (orientation:landscape){.portrait{display:none}}@media (max-height:430px){.ctrl{width:64px;height:64px}.portrait{display:none}#tip{top:9%}}</style></head><body><canvas id="g"></canvas><div id="ui"><div id="title">白泽秘境 · 林间漫步</div><div id="count">灵光 <b id="n">0</b>/4</div><div id="tip"></div><div id="l" class="ctrl">←</div><div id="r" class="ctrl">→</div><div id="j" class="ctrl">跳跃</div><div id="m" class="ctrl">灵力</div><div class="portrait">竖屏也可以测试，横屏会更舒服</div></div><div id="start"><div class="card"><div class="logo">白泽秘境</div><div class="desc" id="load">正在唤醒林间月色…</div><div class="go" id="go" style="opacity:.45">请稍候</div></div></div><div id="done"><div class="card"><div class="logo">今夜的路亮了</div><div class="desc">白泽已经穿过树桥，收齐了四枚灵光。</div><div class="go" id="again">再走一次</div></div></div><script>
(()=>{const c=document.getElementById('g'),x=c.getContext('2d'),start=document.getElementById('start'),done=document.getElementById('done'),load=document.getElementById('load'),go=document.getElementById('go'),again=document.getElementById('again'),tip=document.getElementById('tip'),num=document.getElementById('n'),L=document.getElementById('l'),R=document.getElementById('r'),J=document.getElementById('j'),M=document.getElementById('m');const bg=new Image(),sp=new Image();let ready=false,assets=0;function ok(){assets++;if(assets===2){ready=true;load.textContent='树桥已经亮起。向右走，跳过断点，再试试灵力。';go.textContent='轻触进入';go.style.opacity=1}}function fail(){load.textContent='画面素材没加载出来。请点这里刷新。';go.textContent='刷新重试';go.style.opacity=1;go.onclick=()=>location.reload()}bg.onload=ok;sp.onload=ok;bg.onerror=fail;sp.onerror=fail;Promise.all([fetch('bg_b64.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}),fetch('sprite_b64.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()})]).then(([b,s])=>{bg.src='data:image/webp;base64,'+b.trim();sp.src='data:image/webp;base64,'+s.trim()}).catch(fail);
const WORLD={w:1536,h:864};let W=0,H=0,D=1,last=0,play=false,bridge=0,score=0,parts=[],rings=[],stars=[];const key={l:false,r:false},p={x:535,y:468,vx:0,vy:0,w:68,h:74,dir:1,ground:false,jump:true,sq:1,glow:0};const items=[{x:1005,y:455,a:0},{x:1155,y:430,a:0},{x:1320,y:407,a:0},{x:1460,y:370,a:0}];function size(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function say(t,ms=1900){tip.textContent=t;tip.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>tip.style.opacity=0,ms)}function floor(px){const a=[[300,620,506,490],[620,930,490,514],[930,1085,514,518],[1260,1504,508,485],[1470,1536,460,432]];if(bridge>0)a.push([1085,1260,518,510]);for(const q of a){if(px>=q[0]&&px<=q[1]){const t=(px-q[0])/(q[1]-q[0]);return q[2]+(q[3]-q[2])*t}}return null}function dust(px,py,n=10,col='210,245,255'){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*90,vy:-Math.random()*70,life:.7+Math.random()*.4,r:1+Math.random()*2.4,col})}function jump(){if(play&&p.ground&&p.jump){p.vy=-360;p.ground=false;p.jump=false;p.sq=.78;dust(p.x,p.y+30,8)}}function magic(){if(!play)return;p.glow=1;rings.push({x:p.x,y:p.y,r:10,life:1});dust(p.x,p.y-15,24,'190,245,255');if(p.x>990&&p.x<1225){bridge=5.5;say('灵力唤醒了断桥，光桥会短暂显形。',2200)}for(const it of items){if(!it.a&&Math.hypot(it.x-p.x,it.y-p.y)<120){it.a=1;score++;num.textContent=score;dust(it.x,it.y,20,'255,226,150');say(score===4?'灵光收齐了，继续向右。':'收集到一枚灵光。',1600)}}}function hold(el,k){el.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='j')jump();else if(k==='m')magic();else key[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>{if(k==='l'||k==='r')key[k]=false}))}hold(L,'l');hold(R,'r');hold(J,'j');hold(M,'m');function reset(){score=0;num.textContent=0;bridge=0;parts=[];rings=[];stars=[];items.forEach(i=>i.a=0);Object.assign(p,{x:535,y:468,vx:0,vy:0,dir:1,ground:false,jump:true,sq:1,glow:0});done.style.display='none'}function update(dt){if(!play)return;const acc=760,max=190;if(key.l){p.vx-=acc*dt;p.dir=-1}if(key.r){p.vx+=acc*dt;p.dir=1}if(!key.l&&!key.r)p.vx*=Math.pow(.001,dt);p.vx=clamp(p.vx,-max,max);p.vy+=860*dt;let nx=clamp(p.x+p.vx*dt,310,1515),ny=p.y+p.vy*dt,fy=floor(nx);p.ground=false;if(fy!==null&&p.vy>=0&&ny+p.h/2>=fy&&ny+p.h/2<fy+30){ny=fy-p.h/2;if(Math.abs(p.vy)>130)dust(nx,ny+p.h/2);p.vy=0;p.ground=true;p.jump=true}if(ny>930){nx=535;ny=468;p.vx=p.vy=0;bridge=0;say('掉进水里了，从树桥重新出发。')}p.x=nx;p.y=ny;p.glow=Math.max(0,p.glow-dt*1.6);p.sq+=(1-p.sq)*Math.min(1,dt*10);if(bridge>0)bridge-=dt;for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=45*dt;if(q.life<=0)parts.splice(i,1)}for(let i=rings.length-1;i>=0;i--){rings[i].life-=dt;rings[i].r+=105*dt;if(rings[i].life<=0)rings.splice(i,1)}if(Math.random()<.07)stars.push({x:360+Math.random()*1120,y:170+Math.random()*430,l:1+Math.random()*2,a:.2+Math.random()*.55});for(let i=stars.length-1;i>=0;i--){stars[i].l-=dt;if(stars[i].l<=0)stars.splice(i,1)}if(score===4&&p.x>1490&&p.y<440){play=false;done.style.display='flex'}}function draw(){const fit=W<H;const s=fit?Math.min(W/WORLD.w,H/WORLD.h):Math.max(W/WORLD.w,H/WORLD.h),dw=WORLD.w*s,dh=WORLD.h*s,ox=(W-dw)/2,oy=(H-dh)/2,T=(a,b)=>[ox+a*s,oy+b*s];x.clearRect(0,0,W,H);x.fillStyle='#081321';x.fillRect(0,0,W,H);if(bg.complete&&bg.naturalWidth)x.drawImage(bg,ox,oy,dw,dh);else{const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17365c');g.addColorStop(1,'#07131f');x.fillStyle=g;x.fillRect(0,0,W,H)}for(const it of items){if(it.a)continue;const[a,b]=T(it.x,it.y),r=18*s,rg=x.createRadialGradient(a,b,1,a,b,r);rg.addColorStop(0,'#fffde8');rg.addColorStop(.5,'#ffd970bb');rg.addColorStop(1,'#ffd97000');x.fillStyle=rg;x.beginPath();x.arc(a,b,r,0,7);x.fill()}if(bridge>0){x.strokeStyle='#c6f7ffdd';x.lineWidth=9*s;x.shadowColor='#bdeeff';x.shadowBlur=18*s;x.lineCap='round';x.beginPath();[[1085,518],[1150,513],[1210,511],[1260,510]].forEach((q,i)=>{const[a,b]=T(q[0],q[1]);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke();x.shadowBlur=0}for(const q of stars){const[a,b]=T(q.x,q.y);x.fillStyle=`rgba(255,255,255,${q.a*Math.min(1,q.l)})`;x.beginPath();x.arc(a,b,Math.max(1,1.4*s),0,7);x.fill()}for(const q of rings){const[a,b]=T(q.x,q.y);x.strokeStyle=`rgba(185,245,255,${q.life*.5})`;x.lineWidth=Math.max(1,2*s);x.beginPath();x.arc(a,b,q.r*s,0,7);x.stroke()}for(const q of parts){const[a,b]=T(q.x,q.y);x.fillStyle=`rgba(${q.col},${Math.max(0,q.life)})`;x.beginPath();x.arc(a,b,Math.max(1,q.r*s),0,7);x.fill()}const[a,b]=T(p.x,p.y);if(p.glow){const rg=x.createRadialGradient(a,b,2,a,b,42*s);rg.addColorStop(0,`rgba(196,246,255,${.45*p.glow})`);rg.addColorStop(1,'rgba(196,246,255,0)');x.fillStyle=rg;x.beginPath();x.arc(a,b,42*s,0,7);x.fill()}if(sp.complete&&sp.naturalWidth){x.save();x.translate(a,b+Math.sin(performance.now()*.006)*1.4*s);x.scale(p.dir,1);x.scale(.36*s*p.sq,.36*s*(2-p.sq));x.drawImage(sp,-sp.width/2,-sp.height/2);x.restore()}else{x.fillStyle='#fff';x.beginPath();x.arc(a,b,18*Math.max(.5,s),0,7);x.fill()}}function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);go.addEventListener('pointerdown',()=>{if(!ready){if(load.textContent.includes('没加载'))location.reload();return}reset();play=true;start.style.display='none';say('向右走。断桥前可以跳，也可以用灵力。',2300)});again.addEventListener('pointerdown',()=>{reset();play=true});})();</script></body></html>
